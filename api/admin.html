<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A1 Computer Shop | Admin Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#063b73,#0757a6);
    padding:20px;
}

.admin-box{
    width:100%;
    max-width:400px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#0757a6;
    margin-bottom:8px;
}

.logo span{
    color:#f0a500;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#172033;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccd5df;
    border-radius:10px;
    font-size:16px;
    margin-bottom:18px;
    outline:none;
}

input:focus{
    border-color:#0757a6;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#0757a6;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#063b73;
}

#error{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    background:#fee2e2;
    color:#b91c1c;
    text-align:center;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#0757a6;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="admin-box">

<div class="logo">
A1 <span>COMPUTER SHOP</span>
</div>

<div class="subtitle">
🔐 Admin Panel Login
</div>

<form id="loginForm">

<label for="password">
Admin Password
</label>

<input
type="password"
id="password"
placeholder="Password डालें"
required
autocomplete="current-password"
>

<button type="submit">
🔓 Login
</button>

</form>

<div id="error">
❌ Password गलत है
</div>

<a href="index.html" class="back">
← वापस Website पर जाएँ
</a>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    error.style.display = "none";

    try{

        const response = await fetch("/api/admin-login",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                password:password
            })

        });

        const data = await response.json();

        if(data.success){

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );

            window.location.href =
                "admin-dashboard.html";

        }else{

            error.textContent =
                "❌ Password गलत है";

            error.style.display =
                "block";

        }

    }catch(err){

        error.textContent =
            "⚠️ Server से connection नहीं हो पाया।";

        error.style.display =
            "block";

    }

});

</script>

</body>
</html>
